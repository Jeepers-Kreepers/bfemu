# Эталон рабочего процесса: рабочая копия лежит в .github/workflows/ci.yml.
# Файлы одинаковы — при расхождении скопируйте этот поверх рабочего (см. ci/README.md).

name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Вывод всех проверок — русский. На windows-latest Python пишет stdout в кодировке
# системной кодовой страницы (cp1252), и первое же русское слово роняет шаг с
# UnicodeEncodeError. Эти переменные переводят ввод-вывод на UTF-8.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

# Сами проверки живут в ci/checks.py — этот файл только раздаёт им машины и Python.
# Так логику CI можно менять обычным коммитом: правка файлов в .github/workflows/
# требует токена с правом `workflows`, а правка ci/checks.py — нет.
jobs:
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python ci/checks.py lint

  unit:
    name: Быстрые тесты (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python ci/checks.py unit

  smoke:
    name: Сквозной прогон (протокол, CLI, вкладки)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python ci/checks.py smoke
        timeout-minutes: 15

  windows:
    name: Windows (командные файлы и быстрые тесты)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python ci/checks.py bat unit

  package:
    name: Сборка и установка пакета
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python ci/checks.py package
        timeout-minutes: 10
