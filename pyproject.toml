[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bfemu"
dynamic = ["version"]
description = "Виртуальный полётный контроллер Betaflight (MSP + CLI) для Betaflight Configurator"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["betaflight", "msp", "flight-controller", "emulator", "configurator", "fpv"]
authors = [{ name = "Jeepers-Kreepers" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Emulators",
]
# Зависимостей нет принципиально: только стандартная библиотека.
dependencies = []

[project.optional-dependencies]
# pyserial нужен только для --com (отдать эмулятор в настоящий/виртуальный COM-порт).
serial = ["pyserial>=3.5"]
# Инструменты разработчика: линтер, тесты, покрытие.
dev = ["ruff>=0.6", "pytest>=7", "coverage>=7"]

[project.urls]
Homepage = "https://github.com/Jeepers-Kreepers/bfemu"
Issues = "https://github.com/Jeepers-Kreepers/bfemu/issues"

[project.scripts]
bfemu = "bfemu.__main__:run"

[tool.setuptools]
packages = ["bfemu"]

[tool.setuptools.dynamic]
version = { attr = "bfemu.__version__" }

[tool.setuptools.package-data]
# Таблица настроек, заводские значения и заранее сгенерированный «флеш» чёрного ящика.
bfemu = ["data/*.json", "data/*.bin"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]          # эталонные исходники Betaflight/Configurator — не наш код

[tool.ruff.lint]
# F — настоящие ошибки (неиспользуемые имена, дубликаты ключей, опечатки в именах);
# E/W — базовый стиль; B — ловушки bugbear; UP — устаревшие конструкции.
select = ["E", "W", "F", "B", "UP", "RUF"]
ignore = [
    "E501",     # длина строки: таблицы MSP и тексты CLI читаемее одной строкой
    "E731",     # присваивание lambda — в обработчиках это короче и нагляднее
    "RUF001", "RUF002", "RUF003",   # «неоднозначные» символы — это обычная кириллица
    "RUF012",   # изменяемые атрибуты класса без ClassVar
    "RUF046",   # int() вокруг выражений, где важна явность округления
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tools/*" = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 40        # потолок «не хуже, чем сейчас»; снижается по мере распила больших функций

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
